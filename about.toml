# cargo-about の設定。配布する exe に含まれるクレートのライセンスを集める。
# 生成: cargo about generate --workspace --locked --fail about.hbs -o THIRD-PARTY-LICENSES.txt
# ここに無いライセンスのクレートが加わると、生成がエラーになる。

# 複数から選べるときは、先に書いたものを使う。
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "MIT-0",
    "CC0-1.0",
    "Unlicense",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# 自分たちのクレート（publish = false）は載せない。
private = { ignore = true }
