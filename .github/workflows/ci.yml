name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux（整形・lint・テスト）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - run: cargo test --workspace --locked

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      # 配布する exe に、about.toml で認めていないライセンスのクレートが入っていないこと。
      - run: cargo about generate --workspace --locked --fail about.hbs -o /dev/null

  windows:
    name: Windows（lint・テスト・exe のビルド）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # MSXML での変換と、エクスプローラー連携（テスト用のキーに書く）のテストを含む。
      - run: cargo test --workspace --locked

      - run: cargo build --release --locked -p xml-viewer

      - uses: actions/upload-artifact@v7
        with:
          name: xml-viewer-${{ github.sha }}
          path: target/release/xml-viewer.exe
          retention-days: 14
