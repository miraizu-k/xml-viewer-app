name: Release

# v で始まるタグを push すると、Windows で exe をビルドしてリリースに載せる。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: exe をビルドしてリリースを作る
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: タグと Cargo.toml のバージョンが合っていること
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "タグ $GITHUB_REF_NAME と Cargo.toml のバージョン $version が違います"
            exit 1
          fi

      - run: cargo test --workspace --locked

      - run: cargo build --release --locked -p xml-viewer

      # zip（exe、README、ライセンス）と、その SHA-256 を dist に置く。CI でも同じ手順を通している。
      - name: 配布する zip を作る
        shell: bash
        run: bash packaging/package.sh dist

      - name: リリースを作る
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
