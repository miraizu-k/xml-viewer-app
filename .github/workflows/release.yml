name: Release

# v で始まるタグを push すると、Windows で exe をビルドしてリリースに載せる。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: exe をビルドしてリリースを作る
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: タグと Cargo.toml のバージョンが合っていること
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "タグ $GITHUB_REF_NAME と Cargo.toml のバージョン $version が違います"
            exit 1
          fi

      - run: cargo test --workspace --locked

      - run: cargo build --release --locked -p xml-viewer

      - name: 配布物をまとめる
        shell: bash
        run: |
          mkdir dist
          cp target/release/xml-viewer.exe dist/
          (cd dist && sha256sum xml-viewer.exe > xml-viewer.exe.sha256)

      - name: リリースを作る
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
