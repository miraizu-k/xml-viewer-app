[package]
name = "xml-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
xml-viewer-core = { path = "../core" }

[target."cfg(windows)".dependencies]
tao = "0.37.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_System_Ole", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_Threading"] }
windows-registry = "0.100.0"
wry = "0.57.2"

[build-dependencies]
embed-manifest = "1.5.1"

[dev-dependencies]
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
