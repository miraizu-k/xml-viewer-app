[package]
name = "xml-viewer-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
encoding_rs = "0.8.44"
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole", "Win32_Data_Xml_MsXml"] }

[dev-dependencies]
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
